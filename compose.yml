# Cannu on a Linux server. Log in to Claude Code and gh on the host once, then
# `docker compose up -d --build`, open the page and add a repo. No config file
# or .env needed. By default your home folder is mounted, so your logins work
# and Add repo can see your repos. Set CANNU_REPOS to a folder of clones kept
# for Cannu to look there instead (not a folder a live container builds from),
# and HOME_DIR if your logins live somewhere else.
services:
  cannu:
    build: .
    user: "1000:1000"
    # Host network: previews come up on their own ports, and agents reach
    # Cannu on localhost. Host PIDs: an agent opened from an SSH terminal on
    # the host is still seen as running.
    network_mode: host
    pid: host
    working_dir: ${PWD}
    command: sh -c "gh auth setup-git 2>/dev/null; exec node server.js"
    restart: unless-stopped
    environment:
      HOME: /home/node
      CANNU_REPOS: ${CANNU_REPOS:-${HOME}}
    volumes:
      # Same paths inside and out: worktrees record absolute paths, and
      # Claude Code names each transcript folder after the working directory.
      - ${PWD}:${PWD}
      - ${CANNU_REPOS:-${HOME}}:${CANNU_REPOS:-${HOME}}
      - ${HOME_DIR:-${HOME}}/.claude:/home/node/.claude
      - ${HOME_DIR:-${HOME}}/.claude.json:/home/node/.claude.json
      - ${HOME_DIR:-${HOME}}/.config/gh:/home/node/.config/gh
