# Cannu on a Linux server. Log in to Claude Code and gh on the host once, then
# `docker compose up -d --build`, open the page and add a repo. No config file
# or .env needed. Your home folder is mounted (same path inside), so your
# logins work and any repo under it can be added. To expose less, set
# CANNU_REPOS to a folder of clones kept for Cannu (not a folder a live
# container builds from).
services:
  cannu:
    build: .
    user: "1000:1000"
    # Host network: previews come up on their own ports, and agents reach
    # Cannu on localhost. Host PIDs: an agent opened from an SSH terminal on
    # the host is still seen as running.
    network_mode: host
    pid: host
    working_dir: ${PWD}
    command: sh -c "gh auth setup-git 2>/dev/null; exec node server.js"
    restart: unless-stopped
    environment:
      HOME: /home/node
      # Addresses to listen on, comma separated. Keep 127.0.0.1: agents reach
      # Cannu there. Example: "127.0.0.1,100.64.0.1" (plus a Tailscale IP).
      CANNU_BIND_ADDRESS: ${CANNU_BIND_ADDRESS:-127.0.0.1,::1}
    volumes:
      # Same paths inside and out: worktrees record absolute paths, and
      # Claude Code names each transcript folder after the working directory.
      - ${PWD}:${PWD}
      - ${CANNU_REPOS:-${HOME}}:${CANNU_REPOS:-${HOME}}
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.config/gh:/home/node/.config/gh
